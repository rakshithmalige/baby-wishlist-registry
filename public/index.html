<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harvey-Malige Baby Registry</title>
  <meta name="theme-color" content="#b8476a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baby Registry">
  <link rel="icon" href="data:,">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <p class="hero-emoji" aria-hidden="true">🍼</p>
    <h1 id="title">Harvey-Malige Baby Registry</h1>
    <div class="progress-wrap">
      <p id="progress" class="progress-text"></p>
      <div id="progress-bar" class="progress" role="presentation" hidden>
        <span id="progress-fill" class="progress-fill"></span>
      </div>
    </div>
    <p id="status" class="muted small" aria-live="polite"></p>
  </header>

  <main class="container">
    <section id="no-list" class="card" hidden>
      <p>Open the share link you were sent to see the list.</p>
      <p id="no-list-detail" class="muted small" hidden></p>
    </section>

    <form id="login-form" class="card" hidden>
      <label for="passcode">Owner passcode</label>
      <div class="row">
        <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Sign in</button>
      </div>
    </form>

    <form id="add-form" class="card" hidden>
      <h2>Add something lovely ✨</h2>
      <label>Name
        <input name="name" required maxlength="120" autocomplete="off">
      </label>
      <label>How many do we need?
        <input name="quantity" type="number" min="1" max="20" value="1" inputmode="numeric">
      </label>
      <label>Category
        <select name="category">
          <option>Nursery</option>
          <option>Clothes</option>
          <option>Feeding</option>
          <option value="Bath &amp; care">Bath &amp; care</option>
          <option>Travel</option>
          <option>Toys</option>
          <option selected>Other</option>
        </select>
      </label>
      <label class="inline"><input type="checkbox" name="priority"> ★ Most wanted</label>
      <label>Link <span class="muted">(optional)</span>
        <input name="link" type="text" inputmode="url" autocomplete="off" placeholder="https://">
      </label>
      <label>Notes <span class="muted">(optional)</span>
        <textarea name="notes" rows="2" maxlength="500" placeholder="Size, colour, quantity…"></textarea>
      </label>
      <button class="primary" type="submit">Add to list</button>
    </form>

    <section id="giver" class="card giver-card">
      <label for="giver-name">Your first name <span class="muted">(optional)</span></label>
      <input id="giver-name" type="text" maxlength="40" autocomplete="given-name" placeholder="So the owners can say thank you">
      <p class="muted small">Only the owners see names, on a thank-you list. Leave it blank to stay anonymous.</p>
    </section>

    <div id="filters" class="chips" role="group" aria-label="Filter gifts" hidden></div>
    <ul id="items" class="items" hidden></ul>
    <p id="empty" class="muted center" hidden></p>

    <section id="thank-you" class="card" hidden>
      <h2>Thank-you list 💌</h2>
      <ul id="thank-you-list" class="thank-list"></ul>
    </section>
  </main>

  <footer class="container footer">
    <div class="footer-row">
      <button id="print" class="link-button" type="button">Print list</button>
      <button id="owner-toggle" class="link-button" type="button">Owner sign in</button>
    </div>
    <div id="owner-tools" class="footer-row" hidden>
      <button id="copy-link" class="link-button" type="button">Copy share link</button>
      <a id="backup" class="link-button" download="baby-registry-backup.json">Download backup</a>
      <button id="logout" class="link-button" type="button">Sign out</button>
    </div>
  </footer>

  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2>Edit item</h2>
      <label>Name
        <input name="name" required maxlength="120" autocomplete="off">
      </label>
      <label>How many do we need?
        <input name="quantity" type="number" min="1" max="20" inputmode="numeric">
      </label>
      <label>Category
        <select name="category">
          <option>Nursery</option>
          <option>Clothes</option>
          <option>Feeding</option>
          <option value="Bath &amp; care">Bath &amp; care</option>
          <option>Travel</option>
          <option>Toys</option>
          <option>Other</option>
        </select>
      </label>
      <label class="inline"><input type="checkbox" name="priority"> ★ Most wanted</label>
      <label>Link <span class="muted">(optional)</span>
        <input name="link" type="text" inputmode="url" autocomplete="off">
      </label>
      <label>Notes <span class="muted">(optional)</span>
        <textarea name="notes" rows="2" maxlength="500"></textarea>
      </label>
      <div class="row end">
        <button id="edit-cancel" type="button">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="notice" class="notice" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
